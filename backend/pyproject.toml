[project]
name = "gearbox-diagnostics"
version = "0.1.0"
description = "SCADA-based wind turbine gearbox condition monitoring: multi-target XGBoost NBM, EWMA residual analysis, FMEA-informed interpretation (MSc thesis instrument)"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Quality gates (PROJECT.md §5 tooling, IMPLEMENTATION_PLAN.md M-36)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]

# Dependency-direction contract (ARCHITECTURE.md §3). Layers are appended as
# the corresponding packages come into existence; `core` is the fixed bottom.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layered architecture (ARCHITECTURE.md §3): higher layers import lower only"
type = "layers"
layers = ["app.experiments", "app.models", "app.data", "app.core"]
